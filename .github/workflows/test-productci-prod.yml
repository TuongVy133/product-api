name: Product CI - Production-like

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 3000
      MONGO_URI: mongodb://localhost:27017/productdb_ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start API in background
        run: |
          nohup node server.js > server.log 2>&1 &
          echo "Waiting for API to be ready..."
          for i in {1..15}; do
            if curl -sf http://localhost:3000/health; then
              echo "API is up"
              break
            fi
            sleep 2
          done

      - name: Test CREATE (POST)
        run: |
          curl -sf -X POST http://localhost:3000/api/products \
            -H "Content-Type: application/json" \
            -d '{"pid":"CI001","pname":"Test Laptop","price":999,"quantity":5}' \
            | tee create_response.json
          grep -q "CI001" create_response.json

      - name: Test READ (GET all)
        run: |
          curl -sf http://localhost:3000/api/products | tee list_response.json
          grep -q "CI001" list_response.json

      - name: Test READ ONE (GET by pid)
        run: |
          curl -sf http://localhost:3000/api/products/CI001 | tee one_response.json
          grep -q "Test Laptop" one_response.json

      - name: Test UPDATE (PUT)
        run: |
          curl -sf -X PUT http://localhost:3000/api/products/CI001 \
            -H "Content-Type: application/json" \
            -d '{"price":888}' \
            | tee update_response.json
          grep -q "888" update_response.json

      - name: Test DELETE
        run: |
          curl -sf -X DELETE http://localhost:3000/api/products/CI001 \
            | tee delete_response.json
          grep -q "Deleted" delete_response.json

      - name: Show server logs on failure
        if: failure()
        run: cat server.log

      - name: Build Docker image
        run: docker build -t product-api:ci-prod .