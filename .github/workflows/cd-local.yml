name: CD to Local Docker Engine

on:
  workflow_run:
    workflows: ["Product CI - Production-like"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull latest image from Docker Hub
        shell: powershell
        run: docker compose -f docker-compose-prod.yaml pull

      - name: Start containers
        shell: powershell
        run: docker compose -f docker-compose-prod.yaml up -d

      - name: Wait for API to be healthy
        shell: powershell
        run: |
          for ($i = 0; $i -lt 20; $i++) {
            try {
              $r = Invoke-RestMethod -Uri http://localhost:3000/health -TimeoutSec 3
              if ($r.status -eq 'ok') { Write-Host 'API is healthy'; exit 0 }
            } catch {}
            Start-Sleep -Seconds 3
          }
          Write-Error 'API did not become healthy'
          exit 1

      - name: Show running containers
        shell: powershell
        run: docker compose -f docker-compose-prod.yaml ps